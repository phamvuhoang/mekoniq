function icon(name,size=24){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.layers}</svg>`;}
function tag(text,kind=''){return `<span class="tag ${kind}">${kind?'<i class="status-dot" aria-hidden="true"></i>':''}${T(text)}</span>`;}
function btn(text,action,value='',kind='ghost',symbol){return `<button class="button ${kind}" data-action="${action}" data-value="${value}">${symbol?icon(symbol,16):''}${T(text)}</button>`;}
function choice(text,action,value,selected){return `<button class="button" data-action="${action}" data-value="${value}" aria-pressed="${selected}">${T(text)}</button>`;}
function header(kicker,title,subtitle,badge){return `<div class="slide-head"><div><div class="eyebrow">${T(kicker)}</div><h1>${T(title)}</h1>${subtitle?`<p class="lede">${T(subtitle)}</p>`:''}</div>${badge?tag(badge,'warn'):''}</div>`;}
function note(text){return `<p class="bottom-note">${icon('info',15)}<span>${T(text)}</span></p>`;}
function card(symbol,title,desc){return `<div class="panel"><div class="card-icon">${icon(symbol)}</div><h3>${T(title)}</h3><p class="small muted gap-top">${T(desc)}</p></div>`;}
function metric(value,label){return `<div class="metric-cell"><b>${E(value)}</b><small>${T(label)}</small></div>`;}
function more(text,links=[]){return `<details><summary>${T(W.more)}</summary><p>${T(text)}</p>${links.map(([label,url])=>`<a href="${E(url)}" target="_blank" rel="noopener noreferrer">${E(label)}</a>`).join('')}</details>`;}
function updateUrl(){try{const url=new URL(location.href);url.searchParams.set('lang',state.lang);url.hash=CONFIG.pages[state.page].id;history.replaceState(null,'',url);}catch{}}
function render(focusMain=false){
  if(printing)return;
  const active=document.activeElement;
  const focus=active?.dataset.action?{action:active.dataset.action,value:active.getAttribute('data-value')}:null;
  document.documentElement.lang=state.lang;
  document.title='MEKONIQ · '+L(CONFIG.title);
  document.body.classList.toggle('paused',state.paused);
  const current=CONFIG.pages[state.page];
  document.getElementById('app').innerHTML=`<a class="skip" href="#main">${T(W.skip)}</a><div class="shell ${CONFIG.id}">
  <header class="topbar"><a class="brand" href="#${CONFIG.pages[0].id}" data-action="goto" data-value="0" aria-label="MEKONIQ"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>MEKONIQ</a><div class="edition">${T(CONFIG.title)}<br>2026.10.30 · ${CONFIG.version||'1.0'}</div><div class="top-actions"><div class="languages" role="group" aria-label="${T(W.language)}">${(CONFIG.languageOrder||['vi','ja','en']).map(code=>[code,...{vi:['VI','Tiếng Việt'],ja:['日本語','日本語'],en:['EN','English']}[code]]).map(([code,label,title])=>`<button lang="${code}" data-action="language" data-value="${code}" title="${title}" aria-label="${title}" aria-pressed="${state.lang===code}">${label}</button>`).join('')}</div><button class="icon-btn" data-action="motion" title="${T(state.paused?W.resume:W.pause)}" aria-label="${T(state.paused?W.resume:W.pause)}" aria-pressed="${state.paused}">${icon(state.paused?'play':'pause',17)}</button><button class="icon-btn" data-action="fullscreen" title="${T(W.fullscreen)}" aria-label="${T(W.fullscreen)}">${icon('expand',17)}</button><button class="icon-btn" data-action="print" title="${T(W.print)}" aria-label="${T(W.print)}">${icon('printer',17)}</button></div></header>
  <div class="workspace">${CONFIG.id==='engineering'?`<nav class="side-nav" aria-label="${T(W.chapters)}"><div class="nav-caption">${T(W.chapters)}</div>${CONFIG.pages.map((p,i)=>`<button class="nav-item ${i===state.page?'active':''}" data-action="goto" data-value="${i}" ${i===state.page?'aria-current="page"':''}><span class="nav-num">${String(i+1).padStart(2,'0')}</span>${T(p.label)}</button>`).join('')}<div class="nav-foot">MEKONIQ / SOURCE<br>${T(CONFIG.navFoot)}</div></nav>`:''}<main id="main" tabindex="-1"><section class="slide" data-page="${current.id}" aria-label="${T(current.label)}">${current.render()}</section></main></div>
  <footer class="footer"><div class="footer-note">${T(CONFIG.footer)}<br><span>${T(CONFIG.id==='engineering'?W.illustration:CONFIG.footer2)}</span></div><div class="nav-control"><div class="progress-rail" aria-hidden="true">${CONFIG.pages.map((_,i)=>`<i class="${i<=state.page?'past':''}"></i>`).join('')}</div><span class="slide-count"><strong>${String(state.page+1).padStart(2,'0')}</strong> / ${String(CONFIG.pages.length).padStart(2,'0')}</span><button class="icon-btn" data-action="previous" aria-label="${T(W.previous)}" ${state.page===0?'disabled':''}><span style="display:flex;transform:rotate(180deg)">${icon('chevron',18)}</span></button><button class="icon-btn" data-action="next" aria-label="${T(W.next)}" ${state.page===CONFIG.pages.length-1?'disabled':''}>${icon('chevron',18)}</button></div></footer><div class="live-announcement" aria-live="polite">${T(current.label)}</div></div>`;
  updateUrl();
  if(focusMain){document.getElementById('main').focus({preventScroll:true});scrollTo({top:0,behavior:state.paused?'instant':'smooth'});}
  else if(focus){document.querySelector(`[data-action="${CSS.escape(focus.action)}"]${focus.value===null?'':`[data-value="${CSS.escape(focus.value)}"]`}`)?.focus({preventScroll:true});}
}
function setPage(index){stopFlow();state.page=Math.max(0,Math.min(CONFIG.pages.length-1,index));render(true);}
function stopFlow(){if(flowTimer)clearInterval(flowTimer);flowTimer=null;state.playing=false;}
function startFlow(){if(state.flow===6)state.flow=0;state.playing=true;flowTimer=setInterval(()=>{if(document.hidden||state.paused)return;if(state.flow>=6){stopFlow();render();return;}state.flow++;render();},1450);render();}
document.addEventListener('click',async event=>{
  const target=event.target.closest('[data-action]');if(!target)return;
  const {action,value}=target.dataset;
  if(action==='goto'){event.preventDefault();setPage(+value);return;}
  if(action==='previous'){setPage(state.page-1);return;}
  if(action==='next'){setPage(state.page+1);return;}
  if(action==='language'){state.lang=value;try{localStorage.setItem('mekoniq-presentation-'+CONFIG.id+'-language',value);}catch{}render();document.querySelector(`[data-action="language"][data-value="${value}"]`)?.focus({preventScroll:true});return;}
  if(action==='motion'){state.paused=!state.paused;if(state.paused)stopFlow();render();document.querySelector('[data-action="motion"]')?.focus({preventScroll:true});return;}
  if(action==='fullscreen'){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}return;}
  if(action==='print'){window.print();return;}
  if(action==='flow-play'){if(state.playing)stopFlow();else{state.paused=false;startFlow();}render();return;}
  if(action==='flow-next'){stopFlow();state.flow=(state.flow+1)%7;render();return;}
  if(action==='flow-reset'){stopFlow();state.flow=0;render();return;}
  if(action==='flow-step'){stopFlow();state.flow=+value;render();return;}
  if(action==='drop'){state.drop=!state.drop;render();return;}
  if(['node','network','adapter','preset','cap','wave','journey','segment','future'].includes(action)){state[action]=+value;render();return;}
  if(action==='problem'){state.problem=!state.problem;render();return;}
});
document.addEventListener('keydown',event=>{if(event.altKey||event.metaKey||event.ctrlKey||event.target.closest('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowRight'||event.key==='PageDown'){event.preventDefault();setPage(state.page+1);}if(event.key==='ArrowLeft'||event.key==='PageUp'){event.preventDefault();setPage(state.page-1);}if(event.key==='Home'){event.preventDefault();setPage(0);}if(event.key==='End'){event.preventDefault();setPage(CONFIG.pages.length-1);}});
document.addEventListener('visibilitychange',()=>document.body.classList.toggle('is-hidden',document.hidden));
addEventListener('hashchange',()=>{if(!CONFIG||printing)return;const index=CONFIG.pages.findIndex(p=>p.id===location.hash.slice(1));if(index>=0&&index!==state.page)setPage(index);});
const motionQuery=matchMedia('(prefers-reduced-motion: reduce)');motionQuery.addEventListener('change',e=>{if(e.matches){state.paused=true;stopFlow();render();}});
addEventListener('beforeprint',()=>{stopFlow();printing=true;document.body.classList.add('print-mode');document.getElementById('main').innerHTML=CONFIG.pages.map(p=>`<section class="slide"><div class="print-only label">MEKONIQ / ${T(CONFIG.title)} / 2026.10.30</div>${p.render()}</section>`).join('');});
addEventListener('afterprint',()=>{printing=false;document.body.classList.remove('print-mode');render();});
function boot(config){CONFIG=config;state.lang=config.defaultLang||'vi';try{const q=new URL(location.href).searchParams.get('lang');if(locales.includes(q))state.lang=q;else{const saved=localStorage.getItem('mekoniq-presentation-'+CONFIG.id+'-language');if(locales.includes(saved))state.lang=saved;}}catch{}const hash=location.hash.slice(1);const n=CONFIG.pages.findIndex(p=>p.id===hash);if(n>=0)state.page=n;render();}

function archMap(mode=-1){
 const offline=mode>0,isolated=mode>1,maint=mode===3;
 return `<div class="network"><span class="network-caption">${T(mode<0?EC.tapNode:EC.modes[mode].caption)}</span><svg class="wires" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="wire ${offline?'wire-cut':'wire-active wire-blue'}" d="M21 31V37H50V41M79 31V37H50"/><path class="wire ${offline?'wire-cut':'wire-active wire-blue'}" d="M34 22H66"/><path class="wire ${isolated?'wire-cut':'wire-active'}" d="M50 62V68H17V74M50 68V74M50 68H83V74"/></svg>${EC.nodes.map((n,i)=>`<${mode<0?'button':'div'} class="map-node ${i===2?'hub':''} ${i===state.node&&mode<0?'selected':''} ${offline&&i<2||maint?'unavailable':''} ${isolated&&i>2?'isolated':''}" style="left:${n.x}%;top:${n.y}%" ${mode<0?`data-action="node" data-value="${i}" aria-pressed="${state.node===i}"`:''}>${icon(n.symbol,19)}<strong>${T(n.name)}</strong><small>${T(n.sub)}</small></${mode<0?'button':'div'}>`).join('')}<span class="network-note">${mode<0?'TLS / device identity / durable journal':T(EC.local)}</span></div>`;
}
function engineeringOverview(){const n=EC.nodes[state.node];return header(tr('01 / Kiến trúc triển khai','01 / 配置構成','01 / Deployment architecture'),EC.archTitle,EC.archSub)+`<div class="topology-grid">${archMap()}<aside class="panel detail-panel"><div class="identifier">${String(state.node+1).padStart(2,'0')} / ${T(n.name)}</div><h2>${T(n.title)}</h2><ul>${n.bullets.map(b=>`<li>${T(b)}</li>`).join('')}</ul></aside></div><div class="tech-ribbon"><span>Next.js / Vercel</span><span>Supabase Free</span><span>HTML / Capacitor</span><span>SQLite / Kotlin</span><span>ROS 2 / Nav2</span></div>`+note(W.planned);}
function engineeringFlow(){const s=EC.steps[state.flow];return header(tr('02 / Vòng đời một đơn','02 / 注文ライフサイクル','02 / An order’s lifecycle'),EC.flowTitle,EC.flowSub)+`<div class="row spread no-print">${tag(tr('SIMULATION / ORDER-042','SIMULATION / ORDER-042','SIMULATION / ORDER-042'),'success')}<div class="row">${btn(state.playing?W.stop:W.play,'flow-play','','primary',state.playing?'pause':'play')}${btn(W.step,'flow-next','','ghost','arrow')}${btn(W.reset,'flow-reset','','ghost','sync')}</div></div><div class="stage-track">${EC.steps.map((x,i)=>`<button class="stage ${i<=state.flow?'done':''} ${i===state.flow?'current':''}" data-action="flow-step" data-value="${i}" aria-pressed="${i===state.flow}"><span class="stage-disc">${icon(x[1],21)}</span>${T(x[0])}</button>`).join('')}</div><div class="grid-2"><div class="panel"><div class="flow-detail"><span class="large-step">${String(state.flow+1).padStart(2,'0')}</span><div><h2>${T(s[2])}</h2><p class="small muted gap-top">${T(s[3])}</p></div></div><div class="divider"></div><div class="row">${choice(EC.drop,'drop','',state.drop)}</div><p class="small muted gap-top">${T(state.drop&&state.flow===6?EC.retryNote:EC.noDrop)}</p></div><div class="panel"><div class="panel-top"><span class="label">${T(tr('Receipt trace minh hoạ','receipt traceの例','Illustrative receipt trace'))}</span><span class="mono small">op_042 / epoch 7</span></div>${[[0,'intent.created → operationId: op_042'],[1,'venue.commit → receipt: venue_081'],[3,'robot.accepted → goal: g_019'],[4,'handoff.confirmed → stopRevision: 3'],[5,'cash.recorded → amountMinor: "70000"'],[6,state.drop?'cloud.retry → duplicate: true → count: 1':'cloud.commit → cursor: 218 / ack: cloud']].map(([i,line])=>`<div class="trace-line ${state.flow<i?'pending':''}"><span class="trace-check">${state.flow>=i?'✓':'·'}</span><span>${E(line)}</span></div>`).join('')}</div></div>`;}
function engineeringOffline(){const m=EC.modes[state.network];return header(tr('03 / Business continuity','03 / 事業継続','03 / Business continuity'),EC.continuityTitle,EC.continuitySub)+`<div class="segmented no-print">${EC.modes.map((m,i)=>choice(m.label,'network',i,state.network===i)).join('')}</div><div class="topology-grid gap-top">${archMap(state.network)}<div class="panel detail-panel"><div class="identifier">${T(m.caption)}</div><h2>${T(m.headline)}</h2><div class="micro-list"><div><span class="label">${T(EC.can)}</span><p class="small gap-top" style="margin-top:7px">${T(m.write)}</p></div><div><span class="label">${T(EC.guard)}</span><p class="small gap-top" style="margin-top:7px">${T(m.limit)}</p></div><div><span class="label">${T(EC.recover)}</span><p class="small gap-top" style="margin-top:7px">${T(m.recover)}</p></div></div></div></div>`+note(tr('Adapter phải có capability offline đã kiểm. Auth hết hạn chuyển capture-only; cloud pause/quota lỗi được xử lý như mất WAN.','adapterはoffline capabilityの検証が必要。権限期限切れはcapture-only、cloud pause/容量エラーはWAN切断として扱う。','Adapters need verified offline capability. Expired grants become capture-only; cloud pause/quota failure behaves like WAN loss.'));}
function engineeringData(){return header(tr('04 / Invariant & security','04 / 不変条件とセキュリティ','04 / Invariants & security'),EC.dataTitle,EC.dataSub)+`<div class="grid-2"><div class="panel"><div class="panel-top"><span class="label">${T(EC.transaction)}</span>${tag(EC.atomic,'success')}</div><div class="pipeline"><div class="pipe-block"><b>01</b>authorize<br>CAS / policy</div><span class="arrow">→</span><div class="pipe-block"><b>02</b>snapshot + journal<br>audit + outbox</div><span class="arrow">→</span><div class="pipe-block"><b>03</b>COMMIT<br>receipt → ACK</div></div><p class="small muted">${T(tr('SQLite tại coordinator và PostgreSQL tại cloud là hai transaction riêng, nối bằng sync có receipt.','coordinatorのSQLiteとcloudのPostgreSQLは別transaction。receipt付き同期で接続。','Coordinator SQLite and cloud PostgreSQL are separate transactions, connected by receipted sync.'))}</p></div><div class="panel"><div class="panel-top"><span class="label">Command envelope</span>${icon('lock',18)}</div><pre>{ <span class="key">operationId</span>: <span class="value">"op_042"</span>,

function engineeringRobots(){const a=EC.adapters[state.adapter];return header(tr('05 / Hardware abstraction','05 / ハードウェア抽象化','05 / Hardware abstraction'),EC.robotTitle,EC.robotSub)+`<div class="panel flat"><div class="row spread"><div><span class="label">MEKONIQ RobotAdapter</span><div class="tech-ribbon"><span>describe()</span><span>resolveTarget()</span><span>execute()</span><span>observe()</span><span>reconcile()</span></div></div>${icon('layers',38)}</div></div><div class="adapter-grid">${EC.adapters.map((a,i)=>`<button class="adapter ${state.adapter===i?'active':''}" data-action="adapter" data-value="${i}" aria-pressed="${state.adapter===i}">${icon(a[2],25)}<strong>${E(a[0])}</strong><small>${E(a[1])}</small></button>`).join('')}</div><div class="panel"><div class="row spread"><h2>${T(a[3])}</h2>${tag(tr('Cần xây dựng / nghiệm thu','実装・検証予定','Build / qualify'),'warn')}</div><p class="small muted gap-top">${T(a[4])}</p><div class="row gap-top">${['simulated','integration_tested','hardware_validated','venue_approved'].map((v,i)=>`<span class="pill">${i+1} / ${v}</span>`).join('')}</div></div><div class="safety-strip gap-top">${icon('stop',25)}<span>${T(EC.safety)}</span></div>`;}
function engineeringFeatures(){const core=[0,1,27,28];const trial=[0,1,7,8,27,28];const enabled=i=>state.preset===0?trial.includes(i):state.preset===2?i!==8:true;return header(tr('06 / Product policy','06 / 製品policy','06 / Product policy'),EC.featureTitle,EC.featureSub)+`<div class="row spread"><div class="segmented">${EC.presets.map((p,i)=>choice(p,'preset',i,state.preset===i)).join('')}</div>${tag(tr('Lõi: F01 F02 F28 F29','必須: F01 F02 F28 F29','Core: F01 F02 F28 F29'),'success')}</div><div class="cap-grid">${caps.map((c,i)=>`<button class="cap ${enabled(i)?'enabled':''} ${state.cap===i?'selected':''}" data-action="cap" data-value="${i}" aria-pressed="${state.cap===i}" aria-label="F${String(i+1).padStart(2,'0')} · ${T(c[0])} · ${T(core.includes(i)?W.core:enabled(i)?W.enabled:W.optional)}"><span>F${String(i+1).padStart(2,'0')}${icon(core.includes(i)?'lock':enabled(i)?'check':'plus',11)}</span>${T(c[0])}</button>`).join('')}</div><div class="cap-detail"><div class="number">F${String(state.cap+1).padStart(2,'0')}</div><div><h3>${T(caps[state.cap][0])}</h3><p class="small muted" style="margin-top:5px">${T(caps[state.cap][1])}</p></div></div>${more(EC.presetNote)}${note(tr('Ma trận phạm vi; không phải policy engine production. Với cấu hình không robot, giao tay vẫn qua fulfillment.','機能範囲の図でありproduction policy engineではありません。robotなしでも手動配送はfulfillmentを利用。','A scope map, not the production policy engine. Manual delivery still uses fulfillment without robots.'))}`;}
function engineeringDeploy(){return header(tr('07 / Deployment profile','07 / 配置profile','07 / Deployment profile'),EC.deployTitle,EC.deploySub)+`<div class="grid-4">${EC.quotas.map(q=>`<div class="panel"><div class="label">${T(q[1])}</div><div class="stat gap-top">${E(q[0])}</div><div class="quota-bar" aria-hidden="true"><i></i></div><span class="tiny muted">Supabase Free</span></div>`).join('')}</div>${note(EC.qNote)}<div class="grid-3 gap-top">${card('clock',EC.jobs,EC.jobsBody)}${card('box',EC.blobs,EC.blobsBody)}${card('shield',EC.recovery,EC.recoveryBody)}</div>${more(EC.cloudNotes,[['Supabase pricing','https://supabase.com/pricing'],['Supabase backups','https://supabase.com/docs/guides/platform/backups'],['Vercel plans','https://vercel.com/docs/plans/hobby']])}`;}
