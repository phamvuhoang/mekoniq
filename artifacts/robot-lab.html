function icon(name,size=24){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.layers}</svg>`;}
function tag(text,kind=''){return `<span class="tag ${kind}">${kind?'<i class="status-dot" aria-hidden="true"></i>':''}${T(text)}</span>`;}
function btn(text,action,value='',kind='ghost',symbol){return `<button class="button ${kind}" data-action="${action}" data-value="${value}">${symbol?icon(symbol,16):''}${T(text)}</button>`;}

function setPage(index){stopFlow();state.page=Math.max(0,Math.min(CONFIG.pages.length-1,index));render(true);}
function stopFlow(){if(flowTimer)clearInterval(flowTimer);flowTimer=null;state.playing=false;}
function startFlow(){if(state.flow===6)state.flow=0;state.playing=true;flowTimer=setInterval(()=>{if(document.hidden||state.paused)return;if(state.flow>=6){stopFlow();render();return;}state.flow++;render();},1450);render();}
document.addEventListener('click',async event=>{
  const target=event.target.closest('[data-action]');if(!target)return;
  const {action,value}=target.dataset;
  if(action==='goto'){event.preventDefault();setPage(+value);return;}
  if(action==='previous'){setPage(state.page-1);return;}
  if(action==='next'){setPage(state.page+1);return;}
  if(action==='language'){state.lang=value;try{localStorage.setItem('mekoniq-presentation-'+CONFIG.id+'-language',value);}catch{}render();document.querySelector(`[data-action="language"][data-value="${value}"]`)?.focus({preventScroll:true});return;}
  if(action==='motion'){state.paused=!state.paused;if(state.paused)stopFlow();render();document.querySelector('[data-action="motion"]')?.focus({preventScroll:true});return;}
  if(action==='fullscreen'){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}return;}
  if(action==='print'){window.print();return;}
  if(action==='flow-play'){if(state.playing)stopFlow();else{state.paused=false;startFlow();}render();return;}
  if(action==='flow-next'){stopFlow();state.flow=(state.flow+1)%7;render();return;}
  if(action==='flow-reset'){stopFlow();state.flow=0;render();return;}
  if(action==='flow-step'){stopFlow();state.flow=+value;render();return;}
  if(action==='drop'){state.drop=!state.drop;render();return;}
  if(['node','network','adapter','preset','cap','wave','journey','segment','future'].includes(action)){state[action]=+value;render();return;}
  if(action==='problem'){state.problem=!state.problem;render();return;}
});

function labWorld(){return `${labHead(3,tr('Đặt robot vào nhà hàng.','店舗の中で考える。','Place the robot in your restaurant.'),tr('Chọn một bàn để khám phá điểm giao món.','テーブルを選び、受け渡し位置を見る。','Select a table to explore its handoff point.'))}<div class="lab-split">${labMap()}<div class="lab-aside"><div><span class="lab-control-label">${T(tr('Điểm bàn giao','受け渡し位置','Handoff point'))}</span><div class="lab-table-buttons">${labTablePositions.map((_,i)=>choice(tr(`Bàn ${i+1}`,`卓 ${i+1}`,`Table ${i+1}`),'lab-table',i,state.labTable===i)).join('')}</div></div><h2>${T(tr('Mỗi điểm đều có vai trò.','各地点に役割がある。','Every point has a purpose.'))}</h2><div class="lab-chips">${labChip('pin',tr('Kéo & sửa tọa độ','ドラッグ・座標編集','Drag & edit coordinates'))}${labChip('grid',tr('Bàn & vật cản','テーブル・障害物','Tables & obstacles'))}${labChip('shield',tr('Kiểm tra khoảng trống tĩnh','静的クリアランス確認','Static clearance checks'))}</div><p class="lab-caption">${T(tr('Đường nét đứt minh họa hành trình. Lab chưa có bộ lập đường tránh vật cản.','破線は行程の説明用です。Labに障害物回避経路計画は未実装。','The dashed line illustrates a journey. Lab has no obstacle-avoidance planner yet.'))}</p></div></div>`;}
const labJourneyTitles=[tr('Sẵn sàng xuất phát','出発準備完了','Ready to start'),tr('Tại bếp: chờ tải món','厨房：積み込み待ち','At the kitchen: waiting for loading'),tr('Tại bàn: chờ giao món','テーブル：受け渡し待ち','At the table: waiting for handoff'),tr('Hoàn tất. Về vị trí đỗ.','完了。待機位置へ。','Complete. Back at parking.')];
const labJourneyActions=[tr('Đến bếp','厨房へ','Go to kitchen'),tr('Xác nhận đã tải món','積み込みを確認','Confirm loaded'),tr('Xác nhận đã giao món','受け渡しを確認','Confirm handed off'),tr('Xem lại hành trình','もう一度見る','Restart the journey')];
function labJourney(){const n=state.labJourney;return `${labHead(4,tr('Robot đến. Con người xác nhận.','到着したら、人が確認。','The robot arrives. A person confirms.'),tr('Chạm từng bước để hiểu hành trình S01.','各ステップを操作し、S01の流れを理解。','Step through the S01 delivery journey.'))}<div class="lab-journey-steps">${[tr('Xuất phát','出発','Start'),tr('Tải món','積み込み','Load'),tr('Giao món','受け渡し','Handoff'),tr('Về đỗ','待機','Park')].map((label,i)=>`<div class="${i<=n?'active':''}"><b>0${i+1}</b>${T(label)}</div>`).join('')}</div><div class="lab-split">${labMap(true)}<div class="lab-aside"><span class="lab-state">S01 / ${T(tr('Giao món','配膳','Delivery'))}</span><h2 id="lab-journey-title" aria-live="polite">${T(labJourneyTitles[n])}</h2><div class="lab-big-number">${n===3?'1':'0'}<small> ${T(tr('món đã giao','品を配膳済み','dish handed off'))}</small></div>${n===1||n===2?`<div class="lab-human">${icon('people',26)}${T(tr('Cần nhân viên xác nhận.','スタッフの確認が必要。','Staff confirmation required.'))}</div>`:''}<div class="lab-actions">${btn(labJourneyActions[n],'lab-journey','','primary',n===1||n===2?'check':'arrow')}${n>0?btn(W.reset,'lab-reset'):''}</div></div></div>${labNote(tr('Đây là minh họa. Khi chạy trong Lab thật, source xử lý nghiệp vụ và simulator cung cấp tín hiệu đến nơi.','これは説明用です。実際のLabではsourceが業務を処理し、simulatorが到着を通知します。','This is an illustration. In the actual Lab, source processes the workflow and the simulator supplies arrival observations.'))}`;}
const labFaultData=[
 ['stop',tr('Bị chặn','進路障害','Blocked'),tr('Tạm dừng để xử lý.','停止して対処する。','Pause to resolve the blockage.'),tr('Thử blocked / clear để quan sát trạng thái robot.','blocked / clearで状態の変化を確認。','Use blocked / clear to observe robot state changes.')],
 ['wifi',tr('Mất kết nối','接続断','Offline'),tr('Thấy rõ sự gián đoạn.','切断状態を把握する。','Make the interruption visible.'),tr('Thử offline / online và đọc dấu vết trong báo cáo.','offline / onlineを試し、レポートで記録を確認。','Try offline / online and inspect the report trail.')],
 ['sync',tr('Khởi động lại','再起動','Reboot'),tr('Chưa rõ thì cần kiểm tra.','不明な状態は要確認。','Uncertain state needs attention.'),tr('Giữ needs_attention; không tự gửi lại chuyển động.','needs_attentionを維持。移動を自動再送しません。','Keep needs_attention; do not automatically resend motion.')],
 ['layers',tr('Tín hiệu trùng','重複通知','Duplicate signal'),tr('Một lần giao vẫn là một.','一度の配膳は一度だけ。','One handoff is still one handoff.'),tr('Completion trùng được ghi nhận, không tạo thêm lần giao.','重複完了を記録し、配膳数を増やしません。','Duplicate completion is recorded without another handoff.')]
];
function labFaults(){const f=labFaultData[state.labFault];return `${labHead(5,tr('Thử cả lúc mọi thứ trục trặc.','うまくいかない時も試す。','Explore what happens when things go wrong.'),tr('Bốn tình huống để nhìn rõ cách hệ thống phản ứng.','4つの状況でシステムの反応を確認。','Four situations that reveal how the system responds.'))}<div class="lab-faults">${labFaultData.map(([symbol,label],i)=>`<button data-action="lab-fault" data-value="${i}" aria-pressed="${state.labFault===i}">${icon(symbol,27)}${T(label)}</button>`).join('')}</div><div class="lab-fault-result"><div class="lab-fault-signal" aria-hidden="true"><div class="lab-signal-node">${icon('code',48)}</div><div class="lab-signal-line"></div><div class="lab-signal-node">${icon(f[0],48)}</div></div><div><span class="lab-mini-kicker">${T(f[1])}</span><h2 class="gap-top" id="lab-fault-title" aria-live="polite">${T(f[2])}</h2><p>${T(f[3])}</p></div></div>${labNote(tr('Thử lỗi nghiệp vụ/giao thức. Không đo được khả năng dừng vật lý của robot.','業務・通信の異常テストです。実機の停止性能は測定できません。','Business/protocol fault simulation. It does not measure physical stopping performance.'))}`;}
function labReplayLabel(){return state.labReplay<1?tr('Đang đến bếp','厨房へ移動中','Moving to kitchen'):state.labReplay<3?tr('Chờ tải món','積み込み待ち','Waiting for loading'):state.labReplay<4?tr('Đang đến bàn','テーブルへ移動中','Moving to table'):state.labReplay<7?tr('Chờ giao món','受け渡し待ち','Waiting for handoff'):state.labReplay<8?tr('Đang về đỗ','待機位置へ移動中','Returning to parking'):tr('Hành trình hoàn tất','行程完了','Journey complete');}
function labResults(){return `${labHead(6,tr('Biết điều gì đã xảy ra.','何が起きたかを知る。','Understand what happened.'),tr('Tách thời gian di chuyển và thời gian chờ con người.','移動時間と人の確認待ちを分けて見る。','Separate travel time from time waiting for people.'))}<div class="lab-split"><div class="lab-report"><div class="lab-report-top"><strong>S01 / ${T(tr('Giao món','配膳','Delivery'))}</strong>${tag(LAB.demo)}</div><div class="lab-timeline" role="img" aria-label="${T(tr('8 giây minh họa: 1 giây đi, 2 giây chờ tải, 1 giây đi, 3 giây chờ giao, 1 giây về','8秒の例：移動1秒、積み込み待ち2秒、移動1秒、受け渡し待ち3秒、帰還1秒','8-second example: 1s travel, 2s loading wait, 1s travel, 3s handoff wait, 1s return'))}">${[[1,false],[2,true],[1,false],[3,true],[1,false]].map(([s,wait])=>`<span class="${wait?'wait':''}" style="flex:${s}">${s}s</span>`).join('')}</div><div class="lab-report-legend"><span><i></i>${T(tr('Di chuyển','移動','Travel'))}</span><span class="wait"><i></i>${T(tr('Chờ xác nhận','確認待ち','Human confirmation'))}</span></div><div class="lab-report-stats"><div><b>3 s</b><small>${T(tr('di chuyển','移動','travel'))}</small></div><div><b>5 s</b><small>${T(tr('chờ người','確認待ち','human wait'))}</small></div><div><b>1</b><small>${T(tr('món đã giao','配膳済み','dish handed off'))}</small></div></div></div><div class="lab-aside"><span class="lab-mini-kicker">${T(tr('XEM LẠI','リプレイ','REPLAY'))}</span><h2 id="lab-replay-label" aria-live="polite">${T(labReplayLabel())}</h2><div><label class="lab-control-label" for="lab-replay">${T(tr('Kéo để xem từng thời điểm','スライドして時点を確認','Scrub through the journey'))}</label><input class="lab-replay" id="lab-replay" type="range" min="0" max="8" step="1" value="${state.labReplay}"><output class="lab-replay-value" for="lab-replay">${state.labReplay} / 8 s</output></div><div class="lab-rule lab-chips">${labChip('order',tr('Sự kiện & nhật ký','イベント・ログ','Events & journal'))}${labChip('chart',tr('Số lần phát lệnh','送信回数','Dispatch attempts'))}${labChip('lock',tr('Replay chỉ đọc','読み取り専用リプレイ','Read-only replay'))}</div></div></div>${labNote(tr('Số liệu ở đây là ví dụ. Báo cáo trong Lab lấy sự kiện, nhật ký và revision source của run thật.','ここは説明用の数値です。Labのレポートは実際のrunのイベント、ログ、source revisionを使用。','These numbers are an example. Lab reports use events, journal records and the source revision from the actual run.'))}`;}
function labExport(){return `${labHead(7,tr('Mang thiết kế sang bước tiếp.','設計を次の工程へ。','Take the design to its next step.'),tr('Gói dự thảo để kiểm tra, trao đổi và chuẩn bị tích hợp.','確認・共有・統合準備のための下書きパッケージ。','A draft package for review, discussion and integration planning.'))}<div class="lab-export"><div class="lab-files">${[['robot',tr('Robot','ロボット','Robot'),tr('Cấu hình & profile','構成・profile','Design & profile')],['grid',tr('Nhà hàng','店舗','Restaurant'),tr('Mặt bằng & world','レイアウト・world','Layout & world')],['order',tr('Bằng chứng','証跡','Evidence'),tr('Tham chiếu báo cáo','レポート参照','Report references')],['shield',tr('Kiểm tra','整合性','Integrity'),tr('Hash & checksum','ハッシュ・checksum','Hashes & checksums')]].map(([symbol,title,sub])=>`<div class="lab-file">${icon(symbol,28)}<strong>${T(title)}</strong><small>${T(sub)}</small></div>`).join('')}</div><div class="lab-export-arrow" aria-hidden="true">${icon('arrow',48)}</div><div class="lab-package">${icon('box',100)}<strong>${T(tr('Candidate','候補構成','Candidate'))}</strong><span class="lab-stamp">DRAFT / JSON</span><span class="lab-caption">${T(tr('Sẵn sàng để review','レビューに使える','Ready for review'))}</span></div></div><div class="lab-readiness">${icon('lock',22)}<span>${T(tr('Xuất dự thảo không cấp quyền điều khiển. Apply vào source và nghiệm thu robot là bước tiếp theo.','下書き出力は制御権を付与しません。sourceへの適用と実機検証は今後の工程です。','Exporting a draft does not grant control. Applying it to source and qualifying a robot are future steps.'))}</span></div>`;}
function labScope(){return `${labHead(8,tr('Có thể làm gì ngay hôm nay?','今日、何ができる？','What can you do today?'),null)}<div class="lab-scope"><div class="lab-scope-column current"><span class="lab-mini-kicker">${T(tr('ĐÃ CÓ TRONG LAB','LABで利用可能','AVAILABLE IN LAB'))}</span><h2>${T(tr('Thiết kế & thử nghiệp vụ','設計と業務の検証','Design & business simulation'))}</h2>${[['robot',tr('Robot 3D/2D · cấu hình linh kiện','3D/2Dロボット・部品構成','3D/2D robot · component configuration')],['grid',tr('Mặt bằng · điểm giao món','フロア・受け渡し位置','Floor plan · handoff points')],['route',tr('S01 · xác nhận tải/giao · thử lỗi','S01・積み込み/受け渡し・異常テスト','S01 · load/handoff · fault simulation')],['chart',tr('Báo cáo · replay · xuất draft','レポート・リプレイ・下書き出力','Reports · replay · draft export')]].map(([symbol,label])=>`<div class="lab-scope-item">${icon(symbol,24)}${T(label)}</div>`).join('')}</div><div class="lab-scope-column future"><span class="lab-mini-kicker muted">${T(tr('CHƯA MỞ TRONG LAB','LABでは未対応','NOT YET EXPOSED IN LAB'))}</span><h2>${T(tr('Đi tiếp tới robot thật','実機へつなぐ次の工程','The path to a real robot'))}</h2>${[['code',tr('Backend Valetudo / Gazebo','Valetudo / Gazeboバックエンド','Valetudo / Gazebo backends')],['layers',tr('Scenario mở rộng ngoài S01','S01以外のシナリオ','Scenarios beyond S01')],['box',tr('Apply cấu hình vào source','sourceへの構成適用','Apply configuration to source')],['flag',tr('Thử phần cứng & nghiệm thu venue','実機試験・店舗での受入検証','Hardware tests & venue acceptance')]].map(([symbol,label])=>`<div class="lab-scope-item">${icon(symbol,24)}${T(label)}</div>`).join('')}</div></div><div class="lab-source-strip"><div><strong>Source W00–W11</strong><span> / ${T(tr('Code nền đã có · Lab hiện mở S01','基盤コード実装済み・LabはS01対応','Platform code exists · Lab exposes S01'))}</span></div>${btn(tr('Xem lại từ đầu','最初から見る','Back to the start'),'goto',0,'ghost','sync')}</div>${labNote(tr('Cập nhật 04/11/2026. Mô phỏng nghiệp vụ không thay thế nghiệm thu robot và triển khai thực tế.','2026年11月4日更新。業務シミュレーションは実機検証・本番受入の代わりにはなりません。','Updated 4 November 2026. Business simulation does not replace robot qualification and production acceptance.'))}`;}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;const {action,value}=el.dataset;
 if(action==='lab-trays')state.labTrays=+value;
 else if(action==='lab-explode')state.labExploded=!state.labExploded;
 else if(action==='lab-table')state.labTable=+value;
 else if(action==='lab-journey')state.labJourney=(state.labJourney+1)%4;
 else if(action==='lab-reset')state.labJourney=0;
 else if(action==='lab-fault')state.labFault=+value;
 else return;
 render();
});
document.addEventListener('input',event=>{if(event.target.id!=='lab-replay')return;state.labReplay=+event.target.value;document.getElementById('lab-replay-label').textContent=L(labReplayLabel());document.querySelector('.lab-replay-value').textContent=state.labReplay+' / 8 s';});
boot({id:'robot-lab',title:LAB.title,date:'2026.11.04',version:'1.0',defaultLang:'vi',footer:tr('MEKONIQ / THIẾT KẾ → THỬ NGHIỆM → ĐÁNH GIÁ','MEKONIQ / 設計 → 検証 → 評価','MEKONIQ / DESIGN → EXPERIMENT → REVIEW'),footer2:LAB.preview,pages:[
 {id:'overview',label:LAB.nav[0],render:labOverview},{id:'design',label:LAB.nav[1],render:labDesign},{id:'inside',label:LAB.nav[2],render:labInside},{id:'floor-plan',label:LAB.nav[3],render:labWorld},{id:'delivery',label:LAB.nav[4],render:labJourney},{id:'faults',label:LAB.nav[5],render:labFaults},{id:'results',label:LAB.nav[6],render:labResults},{id:'draft',label:LAB.nav[7],render:labExport},{id:'scope',label:LAB.nav[8],render:labScope}
]});
</script></body></html>
