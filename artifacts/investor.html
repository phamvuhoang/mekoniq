function icon(name,size=24){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.layers}</svg>`;}
function tag(text,kind=''){return `<span class="tag ${kind}">${kind?'<i class="status-dot" aria-hidden="true"></i>':''}${T(text)}</span>`;}
function btn(text,action,value='',kind='ghost',symbol){return `<button class="button ${kind}" data-action="${action}" data-value="${value}">${symbol?icon(symbol,16):''}${T(text)}</button>`;}
function choice(text,action,value,selected){return `<button class="button" data-action="${action}" data-value="${value}" aria-pressed="${selected}">${T(text)}</button>`;}
function header(kicker,title,subtitle,badge){return `<div class="slide-head"><div><div class="eyebrow">${T(kicker)}</div><h1>${T(title)}</h1>${subtitle?`<p class="lede">${T(subtitle)}</p>`:''}</div>${badge?tag(badge,'warn'):''}</div>`;}
function note(text){return `<p class="bottom-note">${icon('info',15)}<span>${T(text)}</span></p>`;}
function card(symbol,title,desc){return `<div class="panel"><div class="card-icon">${icon(symbol)}</div><h3>${T(title)}</h3><p class="small muted gap-top">${T(desc)}</p></div>`;}
function metric(value,label){return `<div class="metric-cell"><b>${E(value)}</b><small>${T(label)}</small></div>`;}
function more(text,links=[]){return `<details><summary>${T(W.more)}</summary><p>${T(text)}</p>${links.map(([label,url])=>`<a href="${E(url)}" target="_blank" rel="noopener noreferrer">${E(label)}</a>`).join('')}</details>`;}
function updateUrl(){try{const url=new URL(location.href);url.searchParams.set('lang',state.lang);url.hash=CONFIG.pages[state.page].id;history.replaceState(null,'',url);}catch{}}
function render(focusMain=false){
  if(printing)return;
  const active=document.activeElement;
  const focus=active?.dataset.action?{action:active.dataset.action,value:active.getAttribute('data-value')}:null;
  document.documentElement.lang=state.lang;
  document.title='MEKONIQ · '+L(CONFIG.title);
  document.body.classList.toggle('paused',state.paused);
  const current=CONFIG.pages[state.page];
  document.getElementById('app').innerHTML=`<a class="skip" href="#main">${T(W.skip)}</a><div class="shell ${CONFIG.id}">
  <header class="topbar"><a class="brand" href="#${CONFIG.pages[0].id}" data-action="goto" data-value="0" aria-label="MEKONIQ"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>MEKONIQ</a><div class="edition">${T(CONFIG.title)}<br>2026.10.30 · v1.0</div><div class="top-actions"><div class="languages" role="group" aria-label="${T(W.language)}">${[['vi','VI','Tiếng Việt'],['ja','日本語','日本語'],['en','EN','English']].map(([code,label,title])=>`<button lang="${code}" data-action="language" data-value="${code}" title="${title}" aria-label="${title}" aria-pressed="${state.lang===code}">${label}</button>`).join('')}</div><button class="icon-btn" data-action="motion" title="${T(state.paused?W.resume:W.pause)}" aria-label="${T(state.paused?W.resume:W.pause)}" aria-pressed="${state.paused}">${icon(state.paused?'play':'pause',17)}</button><button class="icon-btn" data-action="fullscreen" title="${T(W.fullscreen)}" aria-label="${T(W.fullscreen)}">${icon('expand',17)}</button><button class="icon-btn" data-action="print" title="${T(W.print)}" aria-label="${T(W.print)}">${icon('printer',17)}</button></div></header>
  <div class="workspace">${CONFIG.id==='engineering'?`<nav class="side-nav" aria-label="${T(W.chapters)}"><div class="nav-caption">${T(W.chapters)}</div>${CONFIG.pages.map((p,i)=>`<button class="nav-item ${i===state.page?'active':''}" data-action="goto" data-value="${i}" ${i===state.page?'aria-current="page"':''}><span class="nav-num">${String(i+1).padStart(2,'0')}</span>${T(p.label)}</button>`).join('')}<div class="nav-foot">MEKONIQ / SOURCE<br>${T(CONFIG.navFoot)}</div></nav>`:''}<main id="main" tabindex="-1"><section class="slide" data-page="${current.id}" aria-label="${T(current.label)}">${current.render()}</section></main></div>

  updateUrl();
  if(focusMain){document.getElementById('main').focus({preventScroll:true});scrollTo({top:0,behavior:state.paused?'instant':'smooth'});}
  else if(focus){document.querySelector(`[data-action="${CSS.escape(focus.action)}"]${focus.value===null?'':`[data-value="${CSS.escape(focus.value)}"]`}`)?.focus({preventScroll:true});}
}
function setPage(index){stopFlow();state.page=Math.max(0,Math.min(CONFIG.pages.length-1,index));render(true);}
function stopFlow(){if(flowTimer)clearInterval(flowTimer);flowTimer=null;state.playing=false;}
function startFlow(){if(state.flow===6)state.flow=0;state.playing=true;flowTimer=setInterval(()=>{if(document.hidden||state.paused)return;if(state.flow>=6){stopFlow();render();return;}state.flow++;render();},1450);render();}
document.addEventListener('click',async event=>{
  const target=event.target.closest('[data-action]');if(!target)return;
  const {action,value}=target.dataset;
  if(action==='goto'){event.preventDefault();setPage(+value);return;}
  if(action==='previous'){setPage(state.page-1);return;}
  if(action==='next'){setPage(state.page+1);return;}
  if(action==='language'){state.lang=value;try{localStorage.setItem('mekoniq-presentation-language',value);}catch{}render();document.querySelector(`[data-action="language"][data-value="${value}"]`)?.focus({preventScroll:true});return;}
  if(action==='motion'){state.paused=!state.paused;if(state.paused)stopFlow();render();document.querySelector('[data-action="motion"]')?.focus({preventScroll:true});return;}
  if(action==='fullscreen'){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}return;}
  if(action==='print'){window.print();return;}
  if(action==='flow-play'){if(state.playing)stopFlow();else{state.paused=false;startFlow();}render();return;}
  if(action==='flow-next'){stopFlow();state.flow=(state.flow+1)%7;render();return;}
  if(action==='flow-reset'){stopFlow();state.flow=0;render();return;}
  if(action==='flow-step'){stopFlow();state.flow=+value;render();return;}
  if(action==='drop'){state.drop=!state.drop;render();return;}
  if(['node','network','adapter','preset','cap','wave','journey','segment'].includes(action)){state[action]=+value;render();return;}
  if(action==='problem'){state.problem=!state.problem;render();return;}
});
document.addEventListener('keydown',event=>{if(event.altKey||event.metaKey||event.ctrlKey||event.target.closest('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowRight'||event.key==='PageDown'){event.preventDefault();setPage(state.page+1);}if(event.key==='ArrowLeft'||event.key==='PageUp'){event.preventDefault();setPage(state.page-1);}if(event.key==='Home'){event.preventDefault();setPage(0);}if(event.key==='End'){event.preventDefault();setPage(CONFIG.pages.length-1);}});
document.addEventListener('visibilitychange',()=>document.body.classList.toggle('is-hidden',document.hidden));
addEventListener('hashchange',()=>{if(!CONFIG||printing)return;const index=CONFIG.pages.findIndex(p=>p.id===location.hash.slice(1));if(index>=0&&index!==state.page)setPage(index);});
const motionQuery=matchMedia('(prefers-reduced-motion: reduce)');motionQuery.addEventListener('change',e=>{if(e.matches){state.paused=true;stopFlow();render();}});
addEventListener('beforeprint',()=>{stopFlow();printing=true;document.body.classList.add('print-mode');document.getElementById('main').innerHTML=CONFIG.pages.map(p=>`<section class="slide"><div class="print-only label">MEKONIQ / ${T(CONFIG.title)} / 2026.10.30</div>${p.render()}</section>`).join('');});
addEventListener('afterprint',()=>{printing=false;document.body.classList.remove('print-mode');render();});
function boot(config){CONFIG=config;const hash=location.hash.slice(1);const n=CONFIG.pages.findIndex(p=>p.id===hash);if(n>=0)state.page=n;render();}

function continuity(){return header(tr('04 / Thiết kế cho gián đoạn','04 / 中断への備え','04 / Designed for interruptions'),IC.continuityTitle,IC.continuitySub)+`<div class="segmented no-print">${IC.netLabels.map((x,i)=>choice(x,'network',i,state.network===i)).join('')}</div><div class="grid-2 gap-top">${investorNetwork()}<div><div class="panel accent-panel"><div class="label">${T(IC.netLabels[state.network])}</div><h2 class="gap-top">${T(IC.netHeadline[state.network])}</h2><p class="small muted gap-top">${T(IC.netCopy[state.network])}</p></div><div class="micro-list"><div class="micro-row">${icon('check',20)}<strong>${T(IC.noServer)}</strong></div><p class="small muted">${T(IC.noServerBody)}</p></div></div></div>${note(IC.maintenance)}`;}
function hardware(){return header(tr('05 / Chiến lược phần cứng','05 / ハードウェア戦略','05 / Hardware strategy'),IC.hardwareTitle,IC.hardwareSub)+`<div class="hardware-layout"><div><div class="panel"><div class="label">${T(IC.bomLabel)}</div><div class="cost-total gap-top">${number(28.12,2)}</div><div class="stat-unit gap-top">${T(IC.million)}</div><div class="gap-top">${tag(IC.estimate,'warn')}</div></div><div class="grid-2 gap-top" style="gap:12px"><div><div class="label">${T(IC.chassis1)}</div><h3 style="margin-top:7px">WHEELTEC S100</h3></div><div><div class="label">${T(IC.chassis2)}</div><h3 style="margin-top:7px">ZLTECH + ROS 2</h3></div></div></div><div><div class="cost-chart" role="img" aria-label="${T(IC.bomLabel)}: 28.12 million VND">${IC.bom.map(([label,value,color],i)=>`<span style="flex:${value};background:${color};animation-delay:${i*.07}s" title="${T(label)}: ${number(value,2)} M VND"></span>`).join('')}</div>${IC.bom.map(([label,value,color])=>`<div class="cost-row"><i style="background:${color}" aria-hidden="true"></i><span>${T(label)}</span><strong>${number(value,2)} M VND</strong></div>`).join('')}</div></div>${note(IC.hardwareNote)}`;}
function business(){return header(tr('06 / Mô hình kinh doanh đề xuất','06 / 提案する収益モデル','06 / Proposed business model'),IC.businessTitle,IC.businessSub)+`<div class="biz-grid"><div class="revenue-stack">${IC.revenue.map(([i,t,d])=>`<div class="revenue-card">${icon(i,25)}<div><h3>${T(t)}</h3><small>${T(d)}</small></div></div>`).join('')}</div><div class="calculator"><div class="row spread"><span class="label">${T(IC.sandbox)}</span>${icon('chart',20)}</div><div class="range-field"><label for="venues">${T(IC.venues)}<output id="venues-value" for="venues">${number(state.venues)}</output></label><input id="venues" type="range" min="1" max="100" step="1" value="${state.venues}"></div><div class="range-field"><label for="fee">${T(IC.fee)}<output id="fee-value" for="fee">${number(state.fee,1)} M VND</output></label><input id="fee" type="range" min="0.3" max="5" step="0.1" value="${state.fee}"></div><div class="calc-result" aria-live="polite"><div><div class="label">${T(IC.mrr)}</div><div class="stat gap-top"><span id="mrr-value">${number(state.venues*state.fee,1)}</span> <span class="stat-unit">M VND</span></div></div><div><div class="label">${T(IC.arr)}</div><div class="calc-small gap-top"><span id="arr-value">${number(state.venues*state.fee*12,1)}</span> M</div></div></div></div></div>${note(IC.assumptions)}`;}
document.addEventListener('input',event=>{if(!['venues','fee'].includes(event.target.id))return;state[event.target.id]=Number(event.target.value);document.getElementById('venues-value').textContent=number(state.venues);document.getElementById('fee-value').textContent=number(state.fee,1)+' M VND';document.getElementById('mrr-value').textContent=number(state.venues*state.fee,1);document.getElementById('arr-value').textContent=number(state.venues*state.fee*12,1);});
function advantages(){return header(tr('07 / Khác biệt cần chứng minh','07 / 検証すべき強み','07 / Differentiation to prove'),IC.advantageTitle,IC.advantageSub)+`<div class="proof-stack">${IC.advantages.map((x,i)=>`<div class="proof-tile"><span class="proof-number">0${i+1}</span><div><h2>${T(x[0])}</h2><p>${T(x[1])}</p></div></div>`).join('')}</div><div class="panel flat gap-top"><div class="row">${icon('target',24)}<p class="small">${T(IC.pilotMetrics)}</p></div></div>`;}
function milestones(){return header(tr('08 / Tiến độ & cổng nghiệm thu','08 / 進捗と検証gate','08 / Status & evidence gates'),IC.roadmapTitle,IC.roadmapSub)+`<div class="status-road">${tag(IC.trialStatus,'success')}${tag(IC.designStatus,'success')}${tag(IC.sourceStatus,'warn')}</div><div class="milestone-row">${IC.milestones.map((x,i)=>`<div class="milestone"><div class="row spread"><span class="gate-letter">${String.fromCharCode(65+i)}</span><span class="mono tiny muted">${E(x[1])}</span></div><b>${T(x[0])}</b><small>${T(x[2])}</small></div>`).join('')}</div><div class="panel flat"><div class="row spread"><h3>${T(IC.planNumbers)}</h3>${tag(tr('Kế hoạch, chưa phải tính năng đã giao','計画であり提供済み機能ではない','Planned, not delivered functionality'))}</div></div>`;}
function nextMilestone(){return `<div class="hero-layout" style="min-height:300px"><div><div class="eyebrow">MEKONIQ / ${T(tr('Cùng xây dựng','共に構築する','Build together'))}</div><h1>${T(IC.nextTitle1)}<br><span class="accent">${T(IC.nextTitle2)}</span></h1><p class="lede">${T(IC.nextBody)}</p></div><div>${floorPlan()}</div></div><div class="grid-3 gap-top">${card('store',IC.partner,IC.partnerBody)}${card('code',IC.engineering,IC.engineeringBody)}${card('spark',IC.capital,IC.capitalBody)}</div><div class="row spread gap-top"><p class="small muted" style="max-width:650px">${T(IC.closing)}</p><div class="row">${btn(IC.watchFlow,'goto',2,'primary','arrow')}${btn(W.print,'print','','ghost','printer')}</div></div>`;}
boot({id:'investor',title:IC.title,footer:IC.footer,footer2:IC.footer2,pages:[
 {id:'vision',label:IC.nav[0],render:hero},
 {id:'problem',label:IC.nav[1],render:problem},
 {id:'product',label:IC.nav[2],render:product},
 {id:'customers',label:IC.nav[3],render:customers},
 {id:'continuity',label:IC.nav[4],render:continuity},
 {id:'hardware',label:IC.nav[5],render:hardware},
 {id:'business-model',label:IC.nav[6],render:business},
 {id:'advantages',label:IC.nav[7],render:advantages},
 {id:'milestones',label:IC.nav[8],render:milestones},
 {id:'next-milestone',label:IC.nav[9],render:nextMilestone}
]});
</script></body></html>
