name: platform
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ENGINEERING_PYTHON: ${{ github.workspace }}/source/.venv/bin/python
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Check out general CI selector compatibility input
        uses: actions/checkout@v4
        with:
          repository: phamvuhoang/mekoniq-lab
          ref: 65a4593ba728db32a54dfb5d2005f70816422113
          path: lab
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: source/.node-version
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          # the engine workers are pinned to 3.11 (python3.11); the last version listed stays the default `python`
          python-version: |
            3.11
            3.12
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt -e robotics/agent
      - run: pnpm install --frozen-lockfile
      - name: Restore and verify the published regression corpus
        run: bash scripts/restore-platform-ci-inputs.sh >> "$GITHUB_ENV"
      - run: pnpm contracts:check && pnpm typecheck && pnpm lint && pnpm build
      - run: pnpm test:unit && pnpm --filter mekoniq-robot-lab test:unit
      - run: pnpm test:contracts
      - run: pnpm test:adapters
      # Webots runs on macOS only: its cases and the cross-engine one are in the macos-engines job
      - name: Provision the engine workers from their locks and start each once
        run: |
          node scripts/bootstrap-portable-simulation.mjs irsim mujoco algorithm
          node scripts/engine-preflight.mjs irsim mujoco algorithm
      - name: Run integration with its owned database and cleanup receipt
        env:
          MEKONIQ_OWNED_CI_STATE: ${{ runner.temp }}/platform-db-owner.json
        run: |
          node scripts/owned-source-ci.mjs -- pnpm test:integration -- tests/integration \
            --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/platform-integration.xml"
      - name: Summarize integration results
        if: always()
        # Raw owned-service and child logs stay in the private runner temp directory.
        run: python scripts/ci-junit-summary.py "$RUNNER_TEMP/platform-integration.xml"
  # The integration cases only a macOS host can run: the Webots provider, plant and arm, and the cross-engine case (IR-SIM, Webots, MuJoCo). They need no database.
  # A skip fails this job. mujoco-arm-readiness is here for its case that needs a second engine venv.
  macos-engines:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ENGINEERING_PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt -e robotics/agent
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned Webots R2025a
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/webots.dmg" https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a.dmg
          echo "484f6cc84ca794dd33e410b0bfc030132cc5b163a882c350c1d293d06d87584f  $RUNNER_TEMP/webots.dmg" | shasum -a 256 -c -
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/webots-dmg" "$RUNNER_TEMP/webots.dmg"
          ditto "$RUNNER_TEMP/webots-dmg/Webots.app" /Applications/Webots.app
          hdiutil detach "$RUNNER_TEMP/webots-dmg"
      # Before it listens, Webots R2025a connects to the port to see whether it is taken (WbTcpServer::create). On the runners' macOS (26.7, 15.8) a second connect()
      # after a refused one answers EISCONN, which Qt reads as connected: every port looks taken and even `webots --version` exits (cyberbotics/webots#6976, fixed
      # after R2025a). Dropping incoming loopback packets on the ports Webots may listen on (1234-1244 by default, the worker's 20000-29999 for runs) makes that
      # check time out instead. Inbound only: dropping outbound too still fails on ::1. The controllers connect over ipc://, not TCP. Webots itself is untouched.
      - name: Let Webots find its ports free
        run: echo 'block drop in quick on lo0 proto tcp from any to any port { 1234:1244, 20000:29999 }' | sudo pfctl -E -f -
      - name: Provision the engine workers from their locks and start each once
        run: |
          node scripts/bootstrap-portable-simulation.mjs irsim mujoco webots
          node scripts/engine-preflight.mjs irsim mujoco webots
      - name: Run the macOS integration cases
        run: |
          pnpm test:integration -- tests/integration/webots- tests/integration/irsim-plant-port.test.ts tests/integration/cross-engine-fd01.test.ts tests/integration/mujoco-arm-readiness.test.ts \
            --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/macos-integration.xml"
      - name: Summarize integration results
        if: always()
        run: python scripts/ci-junit-summary.py "$RUNNER_TEMP/macos-integration.xml" --forbid-skips
  python:
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    # Python robot executor, hardware profile validation, the cross-runtime schema contract and the pure-Python simulation tooling (world compiler,
    # bridge protocol, actors/metrics, collision). Target runtime is 3.12. robotics/simulation/tests/test_restaurant.py skips itself here: the Gazebo/Nav2
    # scenarios need Docker and ROS 2 Jazzy/Gazebo (see docs/implementation/evidence/W06-T04.md for the command); a skip is never a pass of that gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt -e robotics/agent
      - run: .venv/bin/python -m pytest robotics/agent/tests tests/hardware tests/contracts/test_schema_python.py robotics/simulation/tests -q
      # the arm controller package has its own top-level `bridge`; it runs in its own interpreter, as the plan's unittest commands do
      - run: cd integrations/arm-controller && ../../.venv/bin/python -m pytest tests -q
