# MEKONIQ arm controller — PUMA 560 reference, SIMULATION profile. Units follow the pinned LinuxCNC 2.9 sample: inch, deg, startup G20.
# No drives, no EtherCAT: machine.hal is a virtual loopback. The bridge (bridge/service.py) is a non-real-time client of this instance.
[EMC]
VERSION = 1.1
MACHINE = MEKONIQ puma560-reference (simulation)
DEBUG = 0

[DISPLAY]
DISPLAY = qtvcp -f mekoniq_arm
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.2
PROGRAM_PREFIX = ../../../programs
INTRO_TIME = 0
GEOMETRY = XYZABC

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = sim.var
RS274NGC_STARTUP_CODE = G20 G90 G94 G17 G40 G49 G54

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HAL]
HALFILE = machine.hal
HALUI = halui

[KINS]
JOINTS = 6
KINEMATICS = genserkins

[TRAJ]
COORDINATES = X Y Z A B C
LINEAR_UNITS = inch
ANGULAR_UNITS = deg
DEFAULT_LINEAR_VELOCITY = 1.0
MAX_LINEAR_VELOCITY = 5.0
DEFAULT_ANGULAR_VELOCITY = 10.0
MAX_ANGULAR_VELOCITY = 30.0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[AXIS_X]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 5.0
MAX_ACCELERATION = 50.0

[AXIS_Y]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 5.0
MAX_ACCELERATION = 50.0

[AXIS_Z]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 5.0
MAX_ACCELERATION = 50.0

[AXIS_A]
MIN_LIMIT = -360.0
MAX_LIMIT = 360.0
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 200.0

[AXIS_B]
MIN_LIMIT = -360.0
MAX_LIMIT = 360.0
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 200.0

[AXIS_C]
MIN_LIMIT = -360.0
MAX_LIMIT = 360.0
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 200.0

# JOINT_n = model joint J(n+1); limits, velocity, acceleration and home are the sample INI values (models/puma560-reference/modified-dh.json)
[JOINT_0]
TYPE = ANGULAR
HOME = 0.0
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 200.0
MIN_LIMIT = -180.0
MAX_LIMIT = 180.0
HOME_OFFSET = 0.0
HOME_SEQUENCE = 0

[JOINT_1]
TYPE = ANGULAR
HOME = 0.0
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 200.0
MIN_LIMIT = -360.0
MAX_LIMIT = 360.0
HOME_OFFSET = 0.0
HOME_SEQUENCE = 0

[JOINT_2]
TYPE = ANGULAR
HOME = 0.0
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 200.0
MIN_LIMIT = -215.0
MAX_LIMIT = 35.0
HOME_OFFSET = 0.0
HOME_SEQUENCE = 0

[JOINT_3]
TYPE = ANGULAR
HOME = 0.0
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 200.0
MIN_LIMIT = -360.0
MAX_LIMIT = 360.0
HOME_OFFSET = 0.0
HOME_SEQUENCE = 0

[JOINT_4]
TYPE = ANGULAR
# the sample homes J5 at 0.1 deg to dodge the inverse-kinematics failure at the wrist singularity (a warning to test, not a safety trick)
HOME = 0.1
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 200.0
MIN_LIMIT = -360.0
MAX_LIMIT = 360.0
HOME_OFFSET = 0.0
HOME_SEQUENCE = 0

[JOINT_5]
TYPE = ANGULAR
HOME = 0.0
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 200.0
MIN_LIMIT = -360.0
MAX_LIMIT = 360.0
HOME_OFFSET = 0.0
HOME_SEQUENCE = 0

# MEKONIQ-specific pins read by the bridge and the smoke script (not by LinuxCNC itself)
[MEKONIQ]
BACKEND = linuxcnc_sim
PROFILE = profile.json
MODEL_MANIFEST = ../../../models/puma560-reference/manifest.json
MODEL_MANIFEST_SHA256 = 68f416926d1f5f3fab73a900a9c30667b9a8906da78f9cf78320f73aa2148ef5
